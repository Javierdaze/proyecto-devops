name: devops-automation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos requeridos
        run: |
          for f in src/index.html src/styles.css Dockerfile docker-compose.yml .env.example .gitignore README.md; do
            test -f "$f" || { echo "Falta $f"; exit 1; }
          done
      - name: Verificar que no se versiona .env
        run: test ! -f .env
      - name: Validar Compose
        run: docker compose config -q
      - name: Construir imagen y probar servicio
        run: |
          docker compose up -d --build
          sleep 10
          curl -fsS http://localhost:8080 | grep -q "Reserva"
          docker compose down
